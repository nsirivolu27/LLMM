version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lnkz
      POSTGRES_USER: lnkz
      POSTGRES_PASSWORD: lnkz
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env.example
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  pipeline:
    build: ./pipeline
    env_file: .env.example
    depends_on:
      - redis
      - db
    ports:
      - "8001:8001"

  worker:
    build: ./pipeline
    env_file: .env.example
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      - redis
      - db

  geo-service:
    build: ./geo-service
    env_file: .env.example
    depends_on:
      - db
    ports:
      - "8080:8080"

